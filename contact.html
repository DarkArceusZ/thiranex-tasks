  <main>
    <section aria-labelledby="contact-heading">
      <h1 id="contact-heading">Contact Me</h1>
      <p>Use the form below to send a message about a project, learning opportunity, or collaboration.</p>

      <form action="#" method="post">
        <p>
          <label for="name">Name</label><br>
          <input id="name" name="name" type="text" autocomplete="name" minlength="2" required>
        </p>
        <p>
          <label for="email">Email</label><br>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </p>
        <p>
          <label for="message">Message</label><br>
          <textarea id="message" name="message" rows="6" minlength="10" required></textarea>
        </p>
        <button type="submit">Send message</button>
      </form>
    </section>
  </main>
